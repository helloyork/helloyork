<style>.sh{animation:sh 4.8s ease-in-out infinite}@keyframes sh{0%{transform:translateX(-200px)}55%,100%{transform:translateX(1000px)}}.arr{animation:arr 1.4s ease-in-out infinite alternate}@keyframes arr{from{transform:translateX(0)}to{transform:translateX(6px)}}
