<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">Nomen speaks</title>
<desc id="desc">Dialogue box. Nomen: 「Hi there! I'm Nomen — you might know me as helloyork. I'm a full-stack developer who specializes in front-end, Node.js libraries and serverless back-end development. Lately, I've been building something cool: NarraLeaf.」</desc>
<style>.ring{transform-box:fill-box;transform-origin:center;animation:rot 30s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}.bob{transform-box:fill-box;transform-origin:center;animation:bob 3.5s ease-in-out infinite alternate}@keyframes bob{from{transform:rotate(-12deg) translateY(-2px)}to{transform:rotate(14deg) translateY(3px)}}.auto{animation:blink 1.6s ease-in-out infinite}@keyframes blink{0%,100%{opacity:.45}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs><linearGradient id="box" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1e4a"/><stop offset="1" stop-color="#130f30"/></linearGradient><linearGradient id="name" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8799d"/><stop offset="1" stop-color="#8b6cf0"/></linearGradient><linearGradient id="reveal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset=".93" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient><radialGradient id="crest" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#b9a2ff"/><stop offset=".55" stop-color="#6f52d6"/><stop offset="1" stop-color="#c25b8a"/></radialGradient><mask id="m0" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="330"><rect x="254" y="86" height="48" width="0" fill="url(#reveal)"><animate attributeName="width" values="0;0;814;814;0;0" keyTimes="0;0.0437;0.1430;0.955;0.97;1" dur="16.0s" repeatCount="indefinite"/></rect></mask><mask id="m1" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="330"><rect x="254" y="131" height="48" width="0" fill="url(#reveal)"><animate attributeName="width" values="0;0;767;767;0;0" keyTimes="0;0.1649;0.2678;0.955;0.97;1" dur="16.0s" repeatCount="indefinite"/></rect></mask><mask id="m2" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="330"><rect x="254" y="176" height="48" width="0" fill="url(#reveal)"><animate attributeName="width" values="0;0;782;782;0;0" keyTimes="0;0.2897;0.3890;0.955;0.97;1" dur="16.0s" repeatCount="indefinite"/></rect></mask><mask id="m3" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="330"><rect x="254" y="221" height="48" width="0" fill="url(#reveal)"><animate attributeName="width" values="0;0;758;758;0;0" keyTimes="0;0.4108;0.5101;0.955;0.97;1" dur="16.0s" repeatCount="indefinite"/></rect></mask></defs>
<rect x="20" y="44" width="1160" height="270" rx="18" fill="url(#box)" fill-opacity=".97" stroke="#f2cc8f" stroke-opacity=".55" stroke-width="2"/>
<rect x="30" y="54" width="1140" height="250" rx="12" fill="none" stroke="#fff" stroke-opacity=".07"/>
<path d="M30,49 L35,54 L30,59 L25,54 Z" fill="#f2cc8f" opacity="1.0"/><path d="M1170,49 L1175,54 L1170,59 L1165,54 Z" fill="#f2cc8f" opacity="1.0"/><path d="M30,299 L35,304 L30,309 L25,304 Z" fill="#f2cc8f" opacity="1.0"/><path d="M1170,299 L1175,304 L1170,309 L1165,304 Z" fill="#f2cc8f" opacity="1.0"/>
<circle cx="140" cy="184" r="88" fill="none" stroke="#f2cc8f" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="3 6" class="ring"/><circle cx="140" cy="184" r="78" fill="url(#crest)" stroke="#f2cc8f" stroke-opacity=".8" stroke-width="2"/><text x="140" y="219" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="100" fill="#fff">N</text>
<g transform="translate(204,118) rotate(35) scale(1.7)"><g class="bob"><path d="M0,-11 C7,-7 7,5 0,11 C-7,5 -7,-7 0,-11 Z" fill="#f6a35b"/><path d="M0,-8 L0,14" stroke="#9a4a22" stroke-width="1" stroke-linecap="round"/></g></g>
<rect x="250" y="20" width="180" height="46" rx="10" fill="url(#name)" stroke="#fff" stroke-opacity=".25"/>
<text x="340" y="52" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" fill="#fff" letter-spacing="2">Nomen</text>
<g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="27">
<text x="262" y="120" mask="url(#m0)"><tspan fill="#f4f1ff">「Hi there! I'm Nomen — you might know me as </tspan><tspan fill="#f2cc8f">helloyork</tspan><tspan fill="#f4f1ff">.</tspan></text>
<text x="262" y="165" mask="url(#m1)"><tspan fill="#f4f1ff">I'm a full-stack developer who specializes in front-end,</tspan></text>
<text x="262" y="210" mask="url(#m2)"><tspan fill="#f4f1ff">Node.js libraries and serverless back-end development.</tspan></text>
<text x="262" y="255" mask="url(#m3)"><tspan fill="#f4f1ff">Lately, I've been building something cool: </tspan><tspan fill="#f2cc8f">NarraLeaf</tspan><tspan fill="#f4f1ff">.」</tspan></text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5101;0.5201;0.925;0.955;1" dur="16.0s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="0 0;0 5;0 0" dur="1.1s" repeatCount="indefinite"/><path d="M1122,244 L1144,244 L1133,257 Z" fill="#f2cc8f"/></g></g>
<g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" letter-spacing="2"><text x="1084" y="300" fill="#8f8bb5">CONFIG</text><text x="1023" y="300" fill="#8f8bb5">LOG</text><text x="958" y="300" fill="#8f8bb5">SKIP</text><text x="885" y="300" fill="#f2cc8f">AUTO</text><text x="793" y="300" fill="#8f8bb5">Q.LOAD</text><text x="703" y="300" fill="#8f8bb5">Q.SAVE</text></g>
</svg>
