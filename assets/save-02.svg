<style>.tw{animation:tw 4s ease-in-out infinite alternate}@keyframes tw{from{opacity:.15}to{opacity:1}}.fall{animation:fall 12s linear infinite}@keyframes fall{0%{transform:translate(0,0);opacity:0}6%{opacity:1}88%{opacity:1}100%{transform:translate(-90px,200px);opacity:0}}.sway{animation:sway 3s ease-in-out infinite alternate}@keyframes sway{from{transform:translateX(-20px)}to{transform:translateX(20px)}}.spin{transform-box:fill-box;transform-origin:center;animation:spin 5s linear infinite}@keyframes spin{0%{transform:rotate(0deg) scaleX(1)}50%{transform:rotate(180deg) scaleX(.35)}100%{transform:rotate(360deg) scaleX(1)}}.blink{animation:blink 2s ease-in-out infinite}@keyframes blink{0%,100%{opacity:.4}50%{opacity:1}}.float{animation:float 3s ease-in-out infinite alternate}@keyframes float{from{transform:translateY(0)}to{transform:translateY(-5px)}}
